<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PREGUNTA NERVIOSA</title>
    <link rel="icon" href="videos/blanca.jpg" type="image/x-icon" />    
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('videos/sobre.jpg');
          background-size: cover;
            background-position: center;
            font-family: 'Arial', sans-serif;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }
        
        .question-container {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 40px;
            border-radius: 20px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        h1 {
            font-size: 36px;
            margin-bottom: 40px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .options {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }
        
        .option-btn {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            font-weight: bold;
        }
        
        .option-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        #si-btn {
            background-color: #e74c3c;
            color: white;
        }
        
        #talvez-btn {
            background-color: #f39c12;
            color: white;
        }
        
        #no-btn {
            background-color: #3498db;
            color: white;
        }
        
        .result-container {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            animation: fadeIn 1s ease-in-out;
        }
        
        #motivo-container {
            margin-top: 20px;
            display: none;
        }
        
        textarea {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            margin-bottom: 10px;
            font-family: 'Arial', sans-serif;
        }
        
        #submit-motivo {
            padding: 10px 20px;
            background-color: #f39c12;
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        
        #submit-motivo:hover {
            background-color: #e67e22;
        }
    </style>
</head>
<body>
    <div class="question-container">
        <h1>¿QUIERES SER MI NOVIA?</h1>
        
        <div class="options">
            <button id="si-btn" class="option-btn">SÍ</button>
            <button id="talvez-btn" class="option-btn">TALVEZ</button>
            <button id="no-btn" class="option-btn">NO</button>
        </div>
        
        <div id="result" class="result-container"></div>
        
        <div id="motivo-container">
            <h3>¿Por qué talvez?</h3>
            <textarea id="motivo-text" rows="4" placeholder="Cuéntame tus motivos..."></textarea>
            <button id="submit-motivo">Enviar</button>
        </div>
    </div>

    <script>
        document.getElementById('si-btn').addEventListener('click', function() {
            const poeticResponses = [
                "Como la luz del sol que ilumina el día, tu 'sí' ha iluminado mi vida entera. Gracias por aceptar caminar a mi lado en esta hermosa aventura que llamamos amor.",
                "Un 'sí' que vale más que mil estrellas, un 'sí' que llena mi alma de alegría, un 'sí' que marca el inicio de nuestra historia juntos. Te prometo cuidar este amor cada día.",
                "Tu 'sí' es como una rosa que florece en el jardín de mi corazón, llenando de color y fragancia cada rincón de mi ser. Gracias por hacerme el hombre más feliz del mundo."
            ];
            
            const randomResponse = poeticResponses[Math.floor(Math.random() * poeticResponses.length)];
            
            document.getElementById('result').style.display = 'block';
            document.getElementById('result').style.backgroundColor = 'rgba(231, 76, 60, 0.3)';
            document.getElementById('result').innerHTML = '<h2>♥ ¡Mi corazón está feliz! ♥</h2><p>' + randomResponse + '</p>';
            
            document.querySelector('.options').style.display = 'none';
        });

        document.getElementById('no-btn').addEventListener('click', function() {
            document.getElementById('result').style.display = 'block';
            document.getElementById('result').style.backgroundColor = 'rgba(52, 152, 219, 0.3)';
            document.getElementById('result').innerHTML = '<h2>GRACIAS POR TU RESPUESTA</h2>';
            
            document.querySelector('.options').style.display = 'none';
        });

        document.getElementById('talvez-btn').addEventListener('click', function() {
            document.getElementById('motivo-container').style.display = 'block';
            document.querySelector('.options').style.display = 'none';
        });

        document.getElementById('submit-motivo').addEventListener('click', function () {
        const motivo = document.getElementById('motivo-text').value.trim();
        const numero = '+51 912140501'; // Reemplaza con tu número de WhatsApp real

        if (motivo !== '') {
            const mensaje = encodeURIComponent(`Hola, me dejaron este mensaje desde la página: "${motivo}"`);
            const enlaceWhatsApp = `https://wa.me/${numero}?text=${mensaje}`;
            
            window.open(enlaceWhatsApp, '_blank');

            document.getElementById('result').style.display = 'block';
            document.getElementById('result').style.backgroundColor = 'rgba(243, 156, 18, 0.3)';
            document.getElementById('result').innerHTML = '<h2>Gracias por tu sinceridad</h2><p>Tu mensaje ha sido enviado por WhatsApp.</p>';

            document.getElementById('motivo-container').style.display = 'none';
        } else {
            alert('Por favor, comparte tus motivos');
        }
    });

    </script>
</body>
</html>
